<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .purple:hover{
            background-color: rgb(229, 95, 229);
        }
        .blue:hover{
            background-color: rgb(95, 95, 185);
        }
        .skyblue:hover{
            background-color: rgb(90, 157, 184);
        }
        .green:hover{
            background-color: rgb(102, 213, 102);
        }
        .yellow:hover{
            background-color: rgb(219, 219, 97);
        }
        .orange:hover{
            background-color: rgb(197, 151, 67);
        }
        .red:hover{
            background-color: rgb(168, 96, 96);
        }
        .pink:hover{
            background-color: rgb(255, 0, 0);
        }
        .cyan:hover{
            background-color: rgb(84, 161, 161);
        }
        table{
            margin: 50px auto;
        }
        th{
            height: 100px;
            width: 100px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th class="purple">AA</th>
            <th class="blue">AB</th>
            <th class="skyblue">AC</th>
        </tr>
        <tr>
            <th class="green">AD</th>
            <th class="yellow">AE</th>
            <th class="orange">AF</th>
        </tr>
        <tr>
            <th class="red">AG</th>
            <th class="pink">AH</th>
            <th class="cyan">AI</th>
        </tr>
    </table>
</body>
</html>
