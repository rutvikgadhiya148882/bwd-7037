<body>
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  
  <!-- Internal CSS -->
  <style>
    /* Global Reset & Box Sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font: 16px/1.5 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f8fafc;
      color: #334155;
      padding: 2rem 1rem;
    }

    /* Card Container */
    .product-card {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    /* Card Header */
    .card-header {
      background: #0f172a;
      color: #ffffff;
      padding: 1.5rem;
      text-align: center;
    }

    .card-header h1 {
      font-size: 1.75rem;
      font-weight: 600;
    }

    /* Content Body */
    .card-body {
      padding: 1.5rem;
    }

    /* Data Table Styling */
    .product-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }

    .product-table th, 
    .product-table td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    .product-table th {
      background: #f1f5f9;
      color: #0f172a;
      font-weight: 600;
      width: 35%;
    }

    .product-table tr:hover {
      background: #f8fafc;
    }

    .price-tag {
      color: #059669;
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* Map Section Styling */
    .map-section h2 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }

    .map-container {
      width: 100%;
      height: 300px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Footer */
    .card-footer {
      background: #f1f5f9;
      padding: 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <main class="product-card">
    
    <!-- Header -->
    <header class="card-header">
      <h1>Product Specification Sheet</h1>
    </header>

    <div class="card-body">
      <!-- Tabular Product Details -->
      <table class="product-table">
        <tbody>
          <tr>
            <th>Product ID</th>
            <td>#PRD-98421</td>
          </tr>
          <tr>
            <th>Product Name</th>
            <td>Wireless Noise-Canceling Headphones</td>
          </tr>
          <tr>
            <th>Product Price</th>
            <td class="price-tag">$249.99</td>
          </tr>
          <tr>
            <th>Company</th>
            <td>SoundWave Technologies Inc.</td>
          </tr>
        </tbody>
      </table>

      <!-- Tabular Container for Map / Location -->
      <section class="map-section">
        <h2>Manufacturing / Store Location</h2>
        <div class="map-container">
          <!-- Embed Google Map iframe -->
          <iframe 
            src="https://maps.google.com/maps?q=Cupertino,California&t=&z=13&ie=UTF8&iwloc=&output=embed" 
            allowfullscreen 
            loading="lazy" 
            title="Product Location Map">
          </iframe>
        </div>
      </section>
    </div>

    <!-- Footer -->
    <footer class="card-footer">
      &copy; 2026 SoundWave Technologies Inc. All rights reserved.
    </footer>

  </main>

</body>
</html>
</body>
</html>
