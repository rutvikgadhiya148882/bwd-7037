<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Shapes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #989898;
        }

        h1 {
            color: #000000;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .shape-box {
            width: 180px;
            height: 180px;
            background-color: rgba(255, 255, 255, 0.882);
            border: 2px solid #ddd;
            padding: 20px;
        }

        /* Square */
        .square {
            width: 100px;
            height: 100px;
            background-color: rgb(49, 93, 134);
            margin: 40px auto;
        }

        /* Rectangle */
        .rectangle {
            width: 140px;
            height: 80px;
            background-color: rgb(125, 68, 96);
            margin: 50px auto;
        }

        /* Circle */
        .circle {
            width: 100px;
            height: 100px;
            background-color: rgb(189, 123, 62);
            border-radius: 50%;
            margin: 40px auto;
        }

        /* Oval */
        .oval {
            width: 140px;
            height: 80px;
            background-color: rgb(81, 79, 126);
            border-radius: 50%;
            margin: 50px auto;
        }

        /* Triangle */
        .triangle {
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 100px solid rgb(37, 80, 92);
            margin: 40px auto;
        }

        /* Diamond */
        .diamond {
            width: 80px;
            height: 80px;
            background-color: rgb(145, 92, 121);
            transform: rotate(45deg);
            margin: 50px auto;
        }
    </style>
</head>

<body>

    <h1>Different Shapes Using HTML & CSS</h1>

    <div class="container">

        <div class="shape-box">
            <h3>Square</h3>
            <div class="square"></div>
        </div>

        <div class="shape-box">
            <h3>Rectangle</h3>
            <div class="rectangle"></div>
        </div>

        <div class="shape-box">
            <h3>Circle</h3>
            <div class="circle"></div>
        </div>

        <div class="shape-box">
            <h3>Oval</h3>
            <div class="oval"></div>
        </div>

        <div class="shape-box">
            <h3>Triangle</h3>
            <div class="triangle"></div>
        </div>

        <div class="shape-box">
            <h3>Diamond</h3>
            <div class="diamond"></div>
        </div>

    </div>

</body>
</html>
