<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/submit-donation" method="POST" style="max-width: 400px; padding: 20px; font-family: sans-serif; border: 1px solid #ccc; border-radius: 8px;">
        <h3 style="color: #d9534f; margin-top: 0;">Blood Donation Registration</h3>
      
        <label for="name">Full Name *</label><br>
        <input type="text" id="name" name="name" required style="width: 100%; margin-bottom: 10px; padding: 8px;"><br>
      
        <label for="phone">Phone Number *</label><br>
        <input type="tel" id="phone" name="phone" required style="width: 100%; margin-bottom: 10px; padding: 8px;"><br>
      
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" style="width: 100%; margin-bottom: 10px; padding: 8px;"><br>
      
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <div style="flex: 1;">
            <label for="age">Age *</label><br>
            <input type="number" id="age" name="age" min="18" max="65" required style="width: 100%; padding: 8px;">
          </div>
          <div style="flex: 1;">
            <label for="blood_group">Blood Group *</label><br>
            <select id="blood_group" name="blood_group" required style="width: 100%; padding: 8px;">
              <option value="">Select</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
        </div>
      
        <label>Donated in last 3 months? *</label><br>
        <input type="radio" id="yes" name="recent_donor" value="yes" required> <label for="yes">Yes</label>
        <input type="radio" id="no" name="recent_donor" value="no" style="margin-left: 15px;"> <label for="no">No</label><br><br>
      
        <button type="submit" style="width: 100%; background: #d9534f; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">Register to Donate</button>
      </form>
</body>
</html>
